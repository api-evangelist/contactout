summary: 'REST API: an API key sent in a custom "token" request header on every request (the curl example also sends "authorization: basic"). Keys are issued by ContactOut after booking a meeting. The hosted MCP server uses OAuth 2.0 authorization code with PKCE, completed with the same API token.'
