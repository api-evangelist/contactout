openapi: 3.2.0
info:
  title: ContactOut Hashed Email API
  version: v1
  summary: 'B2B contact data: people and company enrichment, search, contact checks, email verification, campaigns and usage stats.'
  description: Welcome to ContactOut's API. Find anyone's email & phone number 10x faster with the most powerful sales and recruitment intelligence software available. (Generated from the published API reference at https://api.contactout.com; every operation carries x-source pointing at the section it was read from.)
  contact:
    name: ContactOut
    url: https://contactout.com/meeting?utm_source=api_docs
  termsOfService: https://contactout.com/terms
  x-generated-from: documentation
  x-generated-on: '2026-10-07'
  x-generator: 'api-evangelist enrichment pass: deterministic parse of the Slate API reference HTML (headings, parameter tables, example blocks); the pipeline generator generate-contract-from-docs.py was run first and its path-collapse heuristic merged the literal resources linkedin/email/domain into a {v1id} template, so its output was replaced by this parse'
servers:
- url: https://api.contactout.com
security:
- apiToken: []
tags:
- name: Hashed Email API
paths:
  /v1/people/identifiers:
    post:
      summary: Hashed Email API
      tags:
      - Hashed Email API
      operationId: hashedEmail
      description: POST https://api.contactout.com/v1/people/identifiers
      x-source: https://api.contactout.com#email-identifiers-api-http-request
      x-section: Hashed Email API
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashedEmailResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HashedEmailRequest'
      x-cost:
      - Consumes 1 email credit per profile if an email hash is returned.
components:
  responses:
    Forbidden:
      description: 'You''re out of credits, please email your sales manager or book a meeting; or: No access to endpoint'
    RateLimited:
      description: 'Rate limit reached. Check header retry-after: <time_in_seconds> for when rate limit will reset'
      headers:
        retry-after:
          schema:
            type: integer
          description: Seconds until the rate limit resets
    BadCredentials:
      description: Bad credentials or invalid headers
    BadRequest:
      description: Bad request or invalid input
  schemas:
    HashedEmailResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code indicating the success or failure of the request. (integer)
        matches:
          type: object
          description: Hashed identifier results from matched profiles. (object)
        matches.emails:
          type: array
          items: {}
          description: Personal emails from all matched profiles, returned in no particular order. Each email is normalized by trimming whitespace and hashed with SHA-256. A profile with multiple personal emails may return several hashes. Work emails are not included. (array)
        matches_found:
          type: integer
          description: Number of profiles that returned at least one hashed personal email. This is not the number of hashes returned. (integer)
        unmatched:
          type: array
          items: {}
          description: LinkedIn profile URLs from the request that did not return a hashed personal email. (array)
        unmatched_count:
          type: integer
          description: Number of profiles listed in unmatched. (integer)
    HashedEmailRequest:
      type: object
      properties:
        profiles:
          type: array
          items: {}
          description: An array of LinkedIn profile URLs. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/. At least 5 unique profiles are required. (Array, required, min:5 max:100)
      required:
      - profiles
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: token
      description: 'ContactOut uses API keys to allow access to the API. You can request an API key by booking a meeting. ContactOut expects the API key to be included in all API requests to the server in a header that looks like the following: token : <YOUR_API_TOKEN>'
externalDocs:
  url: https://api.contactout.com
  description: ContactOut API Reference
x-rate-limits:
- 'People Search API: 60 requests per minute'
- 'Contact Checker APIs: 150 requests per minute'
- 'Other APIs: 1000 requests per minute'
