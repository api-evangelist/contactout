openapi: 3.2.0
info:
  title: ContactOut Contact Checker API
  version: v1
  summary: 'B2B contact data: people and company enrichment, search, contact checks, email verification, campaigns and usage stats.'
  description: Welcome to ContactOut's API. Find anyone's email & phone number 10x faster with the most powerful sales and recruitment intelligence software available. (Generated from the published API reference at https://api.contactout.com; every operation carries x-source pointing at the section it was read from.)
  contact:
    name: ContactOut
    url: https://contactout.com/meeting?utm_source=api_docs
  termsOfService: https://contactout.com/terms
  x-generated-from: documentation
  x-generated-on: '2026-10-07'
  x-generator: 'api-evangelist enrichment pass: deterministic parse of the Slate API reference HTML (headings, parameter tables, example blocks); the pipeline generator generate-contract-from-docs.py was run first and its path-collapse heuristic merged the literal resources linkedin/email/domain into a {v1id} template, so its output was replaced by this parse'
servers:
- url: https://api.contactout.com
security:
- apiToken: []
tags:
- name: Contact Checker API
paths:
  /v1/people/linkedin/personal_email_status:
    get:
      summary: Personal Email Checker
      tags:
      - Contact Checker API
      operationId: contactCheckerPersonalEmailChecker
      description: GET https://api.contactout.com/v1/people/linkedin/personal_email_status?{profile=}
      x-source: https://api.contactout.com#personal-checker-http-request
      x-section: Contact Checker API Personal Email Checker
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
        description: 'The fully formed URL of the LinkedIn profile. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (profile: (string, URL encoded, required))'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCheckerPersonalEmailCheckerResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Does not consume credits
      x-access:
      - Only available to paid users
  /v1/people/linkedin/work_email_status:
    get:
      summary: Work Email Checker
      tags:
      - Contact Checker API
      operationId: contactCheckerWorkEmailChecker
      description: GET https://api.contactout.com/v1/people/linkedin/work_email_status?{profile=}
      x-source: https://api.contactout.com#work-checker-http-request
      x-section: Contact Checker API Work Email Checker
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
        description: 'The fully formed URL of the LinkedIn profile. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/. (profile: (string, URL encoded, required))'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCheckerWorkEmailCheckerResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Does not consume credits
      x-access:
      - Only available to paid users
  /v1/people/linkedin/phone_status:
    get:
      summary: Phone Number Checker
      tags:
      - Contact Checker API
      operationId: contactCheckerPhoneNumberChecker
      description: GET https://api.contactout.com/v1/people/linkedin/phone_status?{profile=}
      x-source: https://api.contactout.com#phone-checker-http-request
      x-section: Contact Checker API Phone Number Checker
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
        description: 'The fully formed URL of the LinkedIn profile. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (profile: (string, URL encoded, required))'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCheckerPhoneNumberCheckerResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Does not consume credits
      x-access:
      - Only available to paid users
components:
  responses:
    Forbidden:
      description: 'You''re out of credits, please email your sales manager or book a meeting; or: No access to endpoint'
    RateLimited:
      description: 'Rate limit reached. Check header retry-after: <time_in_seconds> for when rate limit will reset'
      headers:
        retry-after:
          schema:
            type: integer
          description: Seconds until the rate limit resets
    BadCredentials:
      description: Bad credentials or invalid headers
    BadRequest:
      description: Bad request or invalid input
  schemas:
    ContactCheckerPersonalEmailCheckerResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Contains personal email availability status for a single LinkedIn profile. email - returns true if personal email is present (object)
    ContactCheckerWorkEmailCheckerResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Contains work email availability status for a single LinkedIn profile. email - returns true if work email is presentemail_status - returns whether the email is verified or unverified. (object)
    ContactCheckerPhoneNumberCheckerResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Contains phone number availability status for a single LinkedIn profile. phone - returns true if phone number is present (object)
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: token
      description: 'ContactOut uses API keys to allow access to the API. You can request an API key by booking a meeting. ContactOut expects the API key to be included in all API requests to the server in a header that looks like the following: token : <YOUR_API_TOKEN>'
externalDocs:
  url: https://api.contactout.com
  description: ContactOut API Reference
x-rate-limits:
- 'People Search API: 60 requests per minute'
- 'Contact Checker APIs: 150 requests per minute'
- 'Other APIs: 1000 requests per minute'
