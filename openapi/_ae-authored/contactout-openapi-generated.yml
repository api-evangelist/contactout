        in: query
        required: false
        schema:
          type: string
        description: The fully formed URL of the company's LinkedIn profile. URL must begin with http and must contain linkedin.com/company/. Accepts both the numeric or string version of the URL, e.g. https://linkedin.com/company/contactout or https://linkedin.com/company/27090845 (string, optional)
      - name: domain
        in: query
        required: false
        schema:
          type: string
        description: The domain name of the company's website, e.g. example.com (string, optional)
      - name: name
        in: query
        required: false
        schema:
