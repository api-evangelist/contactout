        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInfoBulkV1BulkContactinfoRequest'
  /v2/people/linkedin/batch:
    post:
      summary: V2 Bulk ContactInfo
      tags:
      - Contact Info API - Bulk
      operationId: contactInfoBulkV2BulkContactinfo
      description: 'POST https://api.contactout.com/v2/people/linkedin/batch

        Initiate a bulk contact info lookup.'
      x-source: https://api.contactout.com#v2-bulk-contactinfo-post-http-request
      x-section: Contact Info API - Bulk V2 Bulk ContactInfo
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfoBulkV2BulkContactinfoResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInfoBulkV2BulkContactinfoRequest'
      callbacks:
        callbackUrl:
          '{$request.body#/callback_url}':
            post:
              summary: Job result delivered to callback_url
              description: When you include a callback_url in your initial POST request, we deliver the results to that URL automatically once the job finishes. The payload is sent as a POST request with a JSON body containing the fields below.
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        job_id:
                          type: string
                          description: The same job_id returned by the initial POST response. Use this to match the webhook delivery to the original request. (string)
                        profiles:
                          type: object
                          description: An object containing multiple LinkedIn profiles and their associated contact information.emails - An array of all email addresses associated with the LinkedIn profile.personal_emails - An array of personal email addresses associated with the LinkedIn profile.work_emails - An array of work email addresses associated with the LinkedIn profile.phones - An array of phone numbers associated with the LinkedIn profile (if include_phone is true). (object)
              responses:
                '200':
                  description: Your endpoint acknowledges the delivery
