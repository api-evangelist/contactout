  /v1/people/search:
    post:
      summary: People Search API
      tags:
      - People Search API
      operationId: peopleSearch
      description: 'POST https://api.contactout.com/v1/people/search


        Boolean Equations: Few input parameters mentioned in the table above can accept boolean equations as input. Check the "Accepts Boolean" column to know which input fields can accept boolean equations. You can use boolean equations to filter based on a specific criteria. e.g. If you are looking for profiles who have the skills ReactJS and Python, but not Java, you can format the skills parameter as: { "skills": ["(ReactJS AND Python) NOT Java"] }. Always add brackets to ensure the boolean logic is applied correctly. The same logic will apply for the rest of the mentioned paramters. The supported boolean operators are: Boolean operators must be capitalized. Lowercase and, or, and not are treated as part of the search phrase, not as operators. For example, Financial Planning and Analysis is searched as a single phrase. For the industry parameter, prefix a value with NOT to exclude that industry (e.g. { "industry": ["NOT Computer Software", "Banking"] } returns profiles in Banking but
        not Computer Software). AND and OR are not supported for industry filters.'
      x-source: https://api.contactout.com#search-profiles-http-request
      x-section: People Search API
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleSearchResponse'
              example:
                status_code: 200
                metadata:
                  page: 1
                  page_size: 25
                  total_results: 0
                profiles:
                  https://linkedin.com/in/at-JqjtXv:
                    li_vanity: at-JqjtXv
                    title: Research Assistant
                    contact_availability:
                      personal_email: true
                      work_email: true
                      phone: true
                    contact_info:
                      emails: []
                      personal_emails: []
                      work_emails: []
                      work_email_status: []
                      phones: []
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeopleSearchRequest'
      x-cost:
      - Consumes 1 search credit for each profile returned.
      - Consumes 1 email/phone credit for every profile where email/phone info is found, if reveal_info=true is specified.
