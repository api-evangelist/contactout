openapi: 3.1.0
info:
  title: ContactOut API
  version: v1
  summary: 'B2B contact data: people and company enrichment, search, contact checks, email verification, campaigns and usage stats.'
  description: Welcome to ContactOut's API. Find anyone's email & phone number 10x faster with the most powerful sales and recruitment intelligence software available. (Generated from the published API reference at https://api.contactout.com; every operation carries x-source pointing at the section it was read from.)
  contact:
    name: ContactOut
    url: https://contactout.com/meeting?utm_source=api_docs
  termsOfService: https://contactout.com/terms
  x-generated-from: documentation
  x-generated-on: '2026-10-07'
  x-generator: 'api-evangelist enrichment pass: deterministic parse of the Slate API reference HTML (headings, parameter tables, example blocks); the pipeline generator generate-contract-from-docs.py was run first and its path-collapse heuristic merged the literal resources linkedin/email/domain into a {v1id} template, so its output was replaced by this parse'
externalDocs:
  url: https://api.contactout.com
  description: ContactOut API Reference
servers:
- url: https://api.contactout.com
security:
- apiToken: []
tags:
- name: LinkedIn Profile API
- name: People Enrich API
- name: Contact Info API - Single
- name: Contact Info API - Bulk
- name: Company information from domains
- name: People Search API
- name: People Count API
- name: Decision Makers API
- name: Company Search API
- name: Email to LinkedIn API
- name: Contact Checker API
- name: Hashed Email API
- name: Email Verifier API
- name: Campaigns API
- name: API Usage Stats
paths:
  /v1/linkedin/enrich:
    get:
      summary: from LinkedIn URL
      tags:
      - LinkedIn Profile API
      operationId: linkedinProfileFromLinkedinUrl
      description: GET https://api.contactout.com/v1/linkedin/enrich?{profile=}
      x-source: https://api.contactout.com#enrich-linkedin-profile-http-request
      x-section: LinkedIn Profile API from LinkedIn URL
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
        description: The fully formed URL of the LinkedIn profile. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (string, URL encoded, required)
      - name: profile_only
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: 'If set to true, returns the profile data without contact information. (boolean, optional, default: false)'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinProfileFromLinkedinUrlResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Consumes 1 email credit if email is found and 1 phone credit if phone number is found.
      - Consumes 1 search credit if profile_only is set to true or if there is no contact information available for the requested profile.
  /v1/email/enrich:
    get:
      summary: from email address
      tags:
      - LinkedIn Profile API
      operationId: linkedinProfileFromEmailAddress
      description: GET https://api.contactout.com/v1/email/enrich?{email=}
      x-source: https://api.contactout.com#enrich-email-http-request
      x-section: LinkedIn Profile API from email address
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
        description: Email Address (string, required)
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: Data to be returned. Currently support work_email (string, optional)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedinProfileFromEmailAddressResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Consumes 1 email credit if email is found and 1 phone credit if phone number is found.
  /v1/people/enrich:
    post:
      summary: People Enrich API
      tags:
      - People Enrich API
      operationId: peopleEnrich
      description: POST https://api.contactout.com/v1/people/enrich
      x-source: https://api.contactout.com#people-enrich-http-request
      x-section: People Enrich API
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleEnrichResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeopleEnrichRequest'
      x-cost:
      - Consumes 1 search credit if a profile was found.
      - Consumes 1 email credit if email is found and 1 phone credit if phone number is found.
  /v1/people/linkedin:
    get:
      summary: from LinkedIn Profile
      tags:
      - Contact Info API - Single
      operationId: contactInfoSingleFromLinkedinProfile
      description: GET https://api.contactout.com/v1/people/linkedin?{profile=&include_phone=}
      x-source: https://api.contactout.com#contactinfo-from-linkedin-http-request
      x-section: Contact Info API - Single from LinkedIn Profile
      parameters:
      - name: profile
        in: query
        required: true
        schema:
          type: string
        description: 'The fully formed URL of the LinkedIn profile. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (profile: (string, URL encoded, required))'
      - name: include_phone
        in: query
        required: false
        schema:
          type: boolean
        description: If set to true, it will include phone information in the response and deduct phone credits. (boolean, optional, Defaults to false)
      - name: email_type
        in: query
        required: false
        schema:
          type: string
        description: email_type=personal — Returns only personal emails  email_type=work — Returns only work emails  email_type=personal,work — Returns both personal and work emails  email_type=none — Returns no emails and consumes no email credits  By default, both personal and work emails are returned. (string, optional)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfoSingleFromLinkedinProfileResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-cost:
      - Consumes 1 email credit if email is found and 1 phone credit if phone number is found (and include_phone is set to true).
  /v1/people/linkedin/batch:
    post:
      summary: V1 Bulk ContactInfo
      tags:
      - Contact Info API - Bulk
      operationId: contactInfoBulkV1BulkContactinfo
      description: POST https://api.contactout.com/v1/people/linkedin/batch
      x-source: https://api.contactout.com#v1-bulk-contactinfo-http-request
      x-section: Contact Info API - Bulk V1 Bulk ContactInfo
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
