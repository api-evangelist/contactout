components:
  schemas:
    LinkedinProfileFromLinkedinUrlResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Contains profile details related to the URLurl - The URL of the LinkedIn profile.email - An array of email addresses associated with the profile.work_email - An array of work email addresses associated with the profile.personal_email An array of personal email addresses associated with the profile.phone - An array of phone numbers associated with the profile.github - An array of GitHub usernames associated with the profile.twitter - An array of Twitter usernames associated with the profile.full_name - The full name of the profile owner.headline The headline or job title of the profile owner.industry - The industry in which the profile owner works.company - An object containing information about the current company of the profile owner, including name, URL, website, and headquarters location.location - The location of the profile owner.summary - A summary or description of the profile owner's professional background.experience - An array of objects containing details
            about the profile owner's work experience, including start and end dates, job title, description, and company LinkedIn URL.education - An array of objects containing details about the profile owner's education, including institution name, major, start and end dates, degrees, and profile URL.skills - An array of skills associated with the profile owner.certifications - An array of objects containing the certifications of the profile. Includes details like certification name, company, authority, license number and date.publications - An array of objects containing the publications of the profile. Includes details like publication name, description and date.projects - An array of objects containing the project details of the profile. Includes details like the project title, description, start date/month and end date/month.volunteering_experiences - An array of objects containing the volunteering experience details of the profile. Includes details like the volunteer role, organization
            name, cause, start date/month and end date/month.followers - The number of LinkedIn followers the profile has.job_function - The functional area of the profile owner's current role (e.g., Engineering, Marketing, Sales).seniority - The seniority level of the profile owner's current role (e.g., Entry Level, Manager, Vice President).work_status - The current employment status of the profile owner ("open_to_work" or null).profile_picture_url - The URL of the profile picture of the profile owner.updated_at - The date and time when the profile was last updated. (object)
    LinkedinProfileFromEmailAddressResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: object containing all profile details associated with the email address. Also includes phone number if available.email - The user's personal email address.workEmail - The user's work email address. (if include=work_email in request)workEmailStatus - The status of the work email address, whether it's verified or unverifiedfullName - The full name of the user.headline - The job title or professional headline of the user.industry - The industry in which the user works.linkedinUrl - The LinkedIn profile URL of the user.profilePictureUrl - The profile picture URL of the user.confidenceLevel - Confidence level in the accuracy of the profile information.altMatches - Alternative matches or suggestions related to the user's profile.phone - The user's phone number.twitter - The user's Twitter handle.github - The user's GitHub username.company - An object containing information about the user's current company.name - The name of the user's company.url - The LinkedIn URL of the
            company.website - The website URL of the company.headquarter- Location of the company's headquarters.locations - An array containing details of the company's locations.location - The current location of the user.summary - A brief summary of the user's professional experience and skills.experience - An array containing details of the user's work experience.education - An array containing details of the user's educational background.skills - An array containing the user's skills and expertise.certifications - An array of objects containing the certifications of the profile. Includes details like certification name, company, authority, license number and date.publications - An array of objects containing the publications of the profile. Includes details like publication name, description and date.projects - An array of objects containing the project details of the profile. Includes details like the project title, description, start date/month and end date/month.volunteeringExperiences
            - An array of objects containing the volunteering experience details of the profile. Includes details like the volunteer role, organization name, cause, start date/month and end date/month.followers - The number of LinkedIn followers the profile has.updatedAt - The date and time when the profile was last updated. (object)
    PeopleEnrichRequest:
      type: object
      properties:
        linkedin_url:
          type: string
          description: LinkedIn profile URL (string, optional)
        email:
          type: string
          description: Email address (string, optional)
        phone:
          type: string
          description: Phone number (string, optional)
        full_name:
          type: string
          description: Full name of the person (string, optional)
        first_name:
          type: string
          description: First name (must be used with last_name) (string, optional)
        last_name:
          type: string
          description: Last name (must be used with first_name) (string, optional)
        company:
          type: array
          items: {}
          description: Array of company names (array, optional, max:10)
        company_domain:
          type: array
          items: {}
          description: Array of company domains (array, optional, max:10)
        education:
          type: array
          items: {}
          description: Array of educational institutions (array, optional, max:10)
        location:
          type: string
          description: Location/city (string, optional)
        job_title:
          type: string
          description: Job title (string, optional)
        ? ''
        : type: string
        include:
          type: array
          items: {}
          description: 'Data to include: work_email, personal_email, phone (array, optional)'
    PeopleEnrichResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Object containing all profile details associated with the provided parameters.email - The user's personal email address.workEmail - The user's work email address (if include=work_email in request).workEmailStatus - The status of the work email address, whether it's verified or unverified.fullName - The full name of the user.headline - The job title or professional headline of the user.industry - The industry in which the user works.linkedinUrl - The LinkedIn profile URL of the user.profilePictureUrl - The profile picture URL of the user.confidenceLevel - Confidence level in the accuracy of the profile information.altMatches - Alternative matches or suggestions related to the user's profile.phone - The user's phone number.twitter - The user's Twitter handle.github - The user's GitHub username.company - An object containing information about the user's current company including name, URL, website, headquarters, locations, and other company details.location - The current
            location of the user.summary - A brief summary of the user's professional experience and skills.experience - An array containing details of the user's work experience.education - An array containing details of the user's educational background.skills - An array containing the user's skills and expertise.certifications - An array of objects containing the certifications of the profile.publications - An array of objects containing the publications of the profile.projects - An array of objects containing the project details of the profile.volunteering_experiences - An array of objects containing the volunteering experience details of the profile.followers - The number of LinkedIn followers the profile has.jobFunction - The functional area of the user's current role (e.g., Engineering, Marketing, Sales).seniority - The seniority level of the user's current role (e.g., Entry Level, Manager, Vice President).workStatus - The current employment status of the user ("open_to_work" or null).updatedAt
            - The date and time when the profile was last updated. (object)
    ContactInfoSingleFromLinkedinProfileResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. (integer)
        profile:
          type: object
          description: An object containing contact details for the LinkedIn profile. url - The URL of the LinkedIn profile.email - An array of email addresses associated with the profile.work_email - An array of work email addresses.work_email_status - A dictionary indicating the verification status of work emails.personal_email - An array of personal email addresses.phone - An array of phone numbers associated with the profile.github - An array of GitHub usernames associated with the profile. (object)
    ContactInfoBulkV1BulkContactinfoRequest:
      type: object
      properties:
        profiles:
          type: array
          items: {}
          description: An array of LinkedIn profile URLs. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (Array, required, max:100)
        include_phone:
          type: boolean
          default: 'false'
          description: 'If set to true, phone numbers will be included in the response if available. Requires phone credits. (Boolean, optional, default: false)'
        email_type:
          type: string
          description: email_type=personal — Returns only personal emails  email_type=work — Returns only work emails  email_type=personal,work — Returns both personal and work emails  By default, both personal and work emails are returned. (string, optional)
      required:
      - profiles
    ContactInfoBulkV1BulkContactinfoResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profiles:
          type: object
          description: Keys are LinkedIn profile URLs from the request.If include_phone is false or omitted, each value is an array of email addresses.If include_phone is true, each value is an object with emails and phones arrays.Inputs that omit http or fail validation still return an entry using the matching array or object shape above. (object)
    ContactInfoBulkV2BulkContactinfoRequest:
      type: object
      properties:
        callback_url:
          type: string
          description: A URL where the results will be posted once the enrichment operation is completed. (String, optional)
        profiles:
          type: array
          items: {}
          description: An array of LinkedIn profile URLs. URL must begin with http and must contain linkedin.com/in/ or linkedin.com/pub/ (Array, required, Max:1000)
        include_phone:
          type: boolean
          default: 'false'
          description: 'If set to true, phone numbers will be included in the response if available. Requires phone credits. (Boolean, optional, default: false)'
        email_type:
          type: string
          description: email_type=personal — Returns only personal emails  email_type=work — Returns only work emails  email_type=personal,work — Returns both personal and work emails  email_type=none — Returns no emails and consumes no email credits  By default, both personal and work emails are returned. (string, optional)
      required:
      - profiles
    ContactInfoBulkV2BulkContactinfoResponse:
      type: object
      properties:
        status:
          type: string
          description: The initial job status (e.g., QUEUED). (string)
        job_id:
          type: string
          description: The unique identifier for the bulk job. (string)
    ContactInfoBulkV2BulkContactinfoGetResponse:
      type: object
      properties:
        uuid:
          type: string
          description: The unique identifier for the bulk job. This is the same value as job_id from the POST response. Use it to call GET https://api.contactout.com/v2/people/linkedin/batch/{job_id}. (string)
        status:
          type: string
          description: The status of the email lookup request (e.g., SENT indicating the request has been sent) (string)
        result:
          type: object
          description: An object containing multiple LinkedIn profiles and their associated contact information.emails - An array of all email addresses associated with the LinkedIn profile.personal_emails - An array of personal email addresses associated with the LinkedIn profile.work_emails - An array of work email addresses associated with the LinkedIn profile.phones - An array of phone numbers associated with the LinkedIn profile (if include_phone is true). (object)
    CompanyInformationFromDomainsRequest:
      type: object
      properties:
        domains:
          type: array
          items: {}
          description: 'An array of domain names. Each domain should be in a valid format, for ex: example.com (array, required, max:30)'
      required:
      - domains
    CompanyInformationFromDomainsResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code indicating the success or failure of the request. (integer)
        companies:
          type: object
          description: An object containing information about the company associated with the provided domain.company_domain - The domain name of the company, serving as the key for the company object.li_vanity-LinkedIn vanity URL for the company.name - Name of the company.domain - Domain name of the company.description - Brief description of the company.website - URL of the company's website.logo_url - URL of the company's logo image.type - Type of the company (e.g., Privately Held, Public).headquarter - Headquarters location of the company.country - Country where the company is located.size - Size of the company (e.g., number of employees).founded_at - Year the company was founded.locations - Array containing locations where the company operates.city - City of the location.country - Country of the location.isPrimary - Indicates if this location is the primary one.industry - Industry in which the company operates.specialties - Specialties or areas of expertise of the companytechnologies
            - Array of technologies used by the company.revenue - Revenue of the company.employees - Number of employees on LinkedIn.followers - Number of LinkedIn followers.funding - Funding summary object. Contains total_funding_usd, rounds, funding_status, latest_date, number_of_funding_rounds. (object)
    PeopleSearchRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the profile (text)
        job_title:
          type: array
          items: {}
          description: Accepts an array of job titles. (array, max:50)
        past_job_title:
          type: array
          items: {}
          description: 'Returns profiles that held these job titles in past (non-current) roles. Cannot be combined with current_titles_only: false. Cannot be combined with match_experience when both job_title and company are set. (array, max:50)'
        job_function:
          type: array
          items: {}
          description: Accepts an array of job functions to filter profiles by their functional area (e.g., Engineering, Marketing, Sales, Finance). Accepted values list (array, max:50)
        seniority:
          type: array
          items: {}
          description: Accepts an array of seniority levels to filter profiles by their career level. Accepted values list (array, max:50)
        current_titles_only:
          type: boolean
          default: 'true'
          description: 'Returns profiles matching the current job title. If specified false, the response will return profiles matching the current or past job title. (boolean, default: true)'
        include_related_job_titles:
          type: boolean
          default: 'false'
          description: 'Returns profiles with related job titles (boolean, default: false)'
        match_experience:
          type: string
          default: current
          description: 'Ensures job_title and company match in the same experience. current – Returns profiles that match the current experience.past – Returns profiles that match any past experience.both – Returns profiles matching either current or past experience.If set, current_titles_only and company_filter should not be used; otherwise, an error is returned. (string, default: current)'
        skills:
          type: array
          items: {}
          description: Accepts an array of skills (array, max:50)
        languages:
          type: array
          items: {}
          description: Accepts an array of language objects. Each object must have a language field (required string) and optionally a proficiency field (array of strings). If proficiency is not provided, any proficiency level is accepted. Accepted values list for proficiency. (array, max:50)
        education:
          type: array
          items: {}
          description: Accepts an array of schools/degrees (array, max:50)
        educations:
          type: array
          items: {}
          description: 'Accepts an array of education objects. Each object can have optional fields: school_name (string), field_of_study (string), and location (string). At least one field must be provided. (array, max:50)'
        location:
          type: array
          items: {}
          description: Accepts an array of locations (array, max:50)
        location_radius:
          type: integer
          description: Search radius in miles (1-500). Only works when location is provided and the location is a city / area. Filters profiles within the specified radius of the location. (integer)
        current_work_location:
          type: array
          items: {}
          description: Accepts an array of location strings (cities or countries). Filters profiles who currently work in any of the specified locations. (array, max:50)
        past_work_location:
          type: array
          items: {}
          description: Accepts an array of location strings (cities or countries). Filters profiles who previously worked in any of the specified locations. (array, max:50)
        company:
          type: array
          items: {}
          description: Accepts an array of company names (array, max:50)
        past_company:
          type: array
          items: {}
          description: Returns profiles that worked at these companies in past (non-current) roles. Cannot be combined with company_filter set to past, past_only, or both. Cannot be combined with match_experience when both job_title and company are set. (array, max:50)
        company_filter:
          type: string
          default: current
          description: 'current – Returns profiles matching the current company name    past – Returns profiles matching any past company name  past_only – Returns profiles where the company appears in past experience and is not their current employer.  both – Returns profiles matching either current or past experience (string, default: current)'
        current_company_only:
          type: boolean
          default: 'true'
          description: 'Returns profiles matching the current company name (boolean, default: true)'
        domain:
          type: array
          items: {}
          description: Accepts an array of domains (array, max:50)
        industry:
          type: array
          items: {}
          description: Accepts an array of industries. Prefix an industry with NOT to exclude it (e.g. "NOT Computer Software"). Accepted values list (array, max:50)
        keyword:
          type: string
          description: Returns profiles that contain the mentioned keyword anywhere in their profile (text)
        company_size:
          type: array
          items: {}
          description: Accepts an array of company size ranges. Accepted values list (array)
        years_of_experience:
          type: array
          items: {}
          description: Accepts an array of ranges in the format X_Y where X and Y are integers representing the minimum and maximum years of experience. e.g. ["2_5", "6_10"] means 2-5 years OR 6-10 years. (array)
        years_in_current_role:
          type: array
          items: {}
          description: Accepts an array of ranges in the format X_Y where X and Y are integers representing the minimum and maximum years in current role. e.g. ["1_3", "4_6"] means 1-3 years OR 4-6 years in current role. Cannot be used with recently_changed_jobs. (array)
        recently_changed_jobs:
          type: boolean
          default: 'false'
          description: 'If set to true, returns profiles whose current job started within the last 3 calendar months. Cannot be used with years_in_current_role. (boolean, default: false)'
        is_currently_working:
          type: boolean
          description: If true, returns only profiles with an active current role. If false, returns only profiles with no active current role. Omit to return both. (boolean)
        page:
          type: integer
          description: Provides results for the given page (integer)
        page_size:
          type: integer
          default: '25'
          description: 'Maximum number of profiles to return per page. Valid range is 1-25. When not provided, 25 profiles are returned. Search credits are charged only for the number of profiles returned. (integer, default: 25)'
        data_types:
          type: array
          items: {}
          description: Returns profiles containing atleast one of the specified data types. It accepts an array of one more values from this list [personal_email, work_email, phone] (array)
        reveal_info:
          type: boolean
          default: 'false'
          description: 'If set to true, contact_info will contain the emails and phone numbers of the profile and credits will be charged (boolean, default: false)'
        detailed_experience:
          type: boolean
          default: 'false'
          description: 'If set to true, the experience field returns detailed data like title, company_name, summary, start_date_year, start_date_month, end_date_year, end_date_month, is_current, linkedin_url, logo_url. If false, returns simple text strings. (boolean, default: false)'
        detailed_education:
          type: boolean
          default: 'false'
          description: 'If set to true, the education field returns detailed data like school_name, degree, field_of_study, description, start_date_year, end_date_year, url. If false, returns simple text strings. (boolean, default: false)'
        exclude_job_titles:
          type: array
          items: {}
          description: Accepts an array of job titles to exclude from results. (array)
        exclude_companies:
          type: array
          items: {}
          description: Accepts an array of company names to exclude from results. (array)
        exclude_companies_filter:
          type: string
          default: both
          description: 'Applies when exclude_companies is non-empty. current – Exclude if the company appears as the profile''s current employer only.past – Exclude if it appears in past roles only.both – Exclude if it appears in either current or past experience. (string, default: both)'
      required:
      - education
      - job_title
      - keyword
      - past_job_title
      - skills
