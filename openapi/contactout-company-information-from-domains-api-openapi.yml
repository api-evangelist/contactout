openapi: 3.2.0
info:
  title: ContactOut Company information from domains API
  version: v1
  summary: 'B2B contact data: people and company enrichment, search, contact checks, email verification, campaigns and usage stats.'
  description: Welcome to ContactOut's API. Find anyone's email & phone number 10x faster with the most powerful sales and recruitment intelligence software available. (Generated from the published API reference at https://api.contactout.com; every operation carries x-source pointing at the section it was read from.)
  contact:
    name: ContactOut
    url: https://contactout.com/meeting?utm_source=api_docs
  termsOfService: https://contactout.com/terms
  x-generated-from: documentation
  x-generated-on: '2026-10-07'
  x-generator: 'api-evangelist enrichment pass: deterministic parse of the Slate API reference HTML (headings, parameter tables, example blocks); the pipeline generator generate-contract-from-docs.py was run first and its path-collapse heuristic merged the literal resources linkedin/email/domain into a {v1id} template, so its output was replaced by this parse'
servers:
- url: https://api.contactout.com
security:
- apiToken: []
tags:
- name: Company information from domains
paths:
  /v1/domain/enrich:
    post:
      summary: Company information from domains
      tags:
      - Company information from domains
      operationId: companyInformationFromDomains
      description: POST https://api.contactout.com/v1/domain/enrich
      x-source: https://api.contactout.com#enrich-domain-http-request
      x-section: Company information from domains
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInformationFromDomainsResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInformationFromDomainsRequest'
      x-cost:
      - Consumes 1 search credit for each company found.
components:
  responses:
    Forbidden:
      description: 'You''re out of credits, please email your sales manager or book a meeting; or: No access to endpoint'
    RateLimited:
      description: 'Rate limit reached. Check header retry-after: <time_in_seconds> for when rate limit will reset'
      headers:
        retry-after:
          schema:
            type: integer
          description: Seconds until the rate limit resets
    BadCredentials:
      description: Bad credentials or invalid headers
    BadRequest:
      description: Bad request or invalid input
  schemas:
    CompanyInformationFromDomainsResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code indicating the success or failure of the request. (integer)
        companies:
          type: object
          description: An object containing information about the company associated with the provided domain.company_domain - The domain name of the company, serving as the key for the company object.li_vanity-LinkedIn vanity URL for the company.name - Name of the company.domain - Domain name of the company.description - Brief description of the company.website - URL of the company's website.logo_url - URL of the company's logo image.type - Type of the company (e.g., Privately Held, Public).headquarter - Headquarters location of the company.country - Country where the company is located.size - Size of the company (e.g., number of employees).founded_at - Year the company was founded.locations - Array containing locations where the company operates.city - City of the location.country - Country of the location.isPrimary - Indicates if this location is the primary one.industry - Industry in which the company operates.specialties - Specialties or areas of expertise of the companytechnologies - Array of technologies used by the company.revenue - Revenue of the company.employees - Number of employees on LinkedIn.followers - Number of LinkedIn followers.funding - Funding summary object. Contains total_funding_usd, rounds, funding_status, latest_date, number_of_funding_rounds. (object)
    CompanyInformationFromDomainsRequest:
      type: object
      properties:
        domains:
          type: array
          items: {}
          description: 'An array of domain names. Each domain should be in a valid format, for ex: example.com (array, required, max:30)'
      required:
      - domains
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: token
      description: 'ContactOut uses API keys to allow access to the API. You can request an API key by booking a meeting. ContactOut expects the API key to be included in all API requests to the server in a header that looks like the following: token : <YOUR_API_TOKEN>'
externalDocs:
  url: https://api.contactout.com
  description: ContactOut API Reference
x-rate-limits:
- 'People Search API: 60 requests per minute'
- 'Contact Checker APIs: 150 requests per minute'
- 'Other APIs: 1000 requests per minute'
