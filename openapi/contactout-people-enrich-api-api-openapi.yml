openapi: 3.2.0
info:
  title: ContactOut People Enrich API
  version: v1
  summary: 'B2B contact data: people and company enrichment, search, contact checks, email verification, campaigns and usage stats.'
  description: Welcome to ContactOut's API. Find anyone's email & phone number 10x faster with the most powerful sales and recruitment intelligence software available. (Generated from the published API reference at https://api.contactout.com; every operation carries x-source pointing at the section it was read from.)
  contact:
    name: ContactOut
    url: https://contactout.com/meeting?utm_source=api_docs
  termsOfService: https://contactout.com/terms
  x-generated-from: documentation
  x-generated-on: '2026-10-07'
  x-generator: 'api-evangelist enrichment pass: deterministic parse of the Slate API reference HTML (headings, parameter tables, example blocks); the pipeline generator generate-contract-from-docs.py was run first and its path-collapse heuristic merged the literal resources linkedin/email/domain into a {v1id} template, so its output was replaced by this parse'
servers:
- url: https://api.contactout.com
security:
- apiToken: []
tags:
- name: People Enrich API
paths:
  /v1/people/enrich:
    post:
      summary: People Enrich API
      tags:
      - People Enrich API
      operationId: peopleEnrich
      description: POST https://api.contactout.com/v1/people/enrich
      x-source: https://api.contactout.com#people-enrich-http-request
      x-section: People Enrich API
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleEnrichResponse'
        '400':
          $ref: '#/components/responses/BadCredentials'
        '401':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeopleEnrichRequest'
      x-cost:
      - Consumes 1 search credit if a profile was found.
      - Consumes 1 email credit if email is found and 1 phone credit if phone number is found.
components:
  responses:
    Forbidden:
      description: 'You''re out of credits, please email your sales manager or book a meeting; or: No access to endpoint'
    RateLimited:
      description: 'Rate limit reached. Check header retry-after: <time_in_seconds> for when rate limit will reset'
      headers:
        retry-after:
          schema:
            type: integer
          description: Seconds until the rate limit resets
    BadCredentials:
      description: Bad credentials or invalid headers
    BadRequest:
      description: Bad request or invalid input
  schemas:
    PeopleEnrichRequest:
      type: object
      properties:
        linkedin_url:
          type: string
          description: LinkedIn profile URL (string, optional)
        email:
          type: string
          description: Email address (string, optional)
        phone:
          type: string
          description: Phone number (string, optional)
        full_name:
          type: string
          description: Full name of the person (string, optional)
        first_name:
          type: string
          description: First name (must be used with last_name) (string, optional)
        last_name:
          type: string
          description: Last name (must be used with first_name) (string, optional)
        company:
          type: array
          items: {}
          description: Array of company names (array, optional, max:10)
        company_domain:
          type: array
          items: {}
          description: Array of company domains (array, optional, max:10)
        education:
          type: array
          items: {}
          description: Array of educational institutions (array, optional, max:10)
        location:
          type: string
          description: Location/city (string, optional)
        job_title:
          type: string
          description: Job title (string, optional)
        ? ''
        : type: string
        include:
          type: array
          items: {}
          description: 'Data to include: work_email, personal_email, phone (array, optional)'
    PeopleEnrichResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: The HTTP status code of the response. Indicates the success or failure of the API request. (integer)
        profile:
          type: object
          description: Object containing all profile details associated with the provided parameters.email - The user's personal email address.workEmail - The user's work email address (if include=work_email in request).workEmailStatus - The status of the work email address, whether it's verified or unverified.fullName - The full name of the user.headline - The job title or professional headline of the user.industry - The industry in which the user works.linkedinUrl - The LinkedIn profile URL of the user.profilePictureUrl - The profile picture URL of the user.confidenceLevel - Confidence level in the accuracy of the profile information.altMatches - Alternative matches or suggestions related to the user's profile.phone - The user's phone number.twitter - The user's Twitter handle.github - The user's GitHub username.company - An object containing information about the user's current company including name, URL, website, headquarters, locations, and other company details.location - The current location of the user.summary - A brief summary of the user's professional experience and skills.experience - An array containing details of the user's work experience.education - An array containing details of the user's educational background.skills - An array containing the user's skills and expertise.certifications - An array of objects containing the certifications of the profile.publications - An array of objects containing the publications of the profile.projects - An array of objects containing the project details of the profile.volunteering_experiences - An array of objects containing the volunteering experience details of the profile.followers - The number of LinkedIn followers the profile has.jobFunction - The functional area of the user's current role (e.g., Engineering, Marketing, Sales).seniority - The seniority level of the user's current role (e.g., Entry Level, Manager, Vice President).workStatus - The current employment status of the user ("open_to_work" or null).updatedAt - The date and time when the profile was last updated. (object)
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: token
      description: 'ContactOut uses API keys to allow access to the API. You can request an API key by booking a meeting. ContactOut expects the API key to be included in all API requests to the server in a header that looks like the following: token : <YOUR_API_TOKEN>'
externalDocs:
  url: https://api.contactout.com
  description: ContactOut API Reference
x-rate-limits:
- 'People Search API: 60 requests per minute'
- 'Contact Checker APIs: 150 requests per minute'
- 'Other APIs: 1000 requests per minute'
