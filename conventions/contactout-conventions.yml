rate_limit_signaling:
  status: 429
  headers:
  - 'retry-after: <time_in_seconds>'
  limits:
  - 'People Search API: 60 requests per minute'
  - 'Contact Checker APIs: 150 requests per minute'
  - 'Other APIs: 1000 requests per minute'
  artifact: rate-limits/contactout-rate-limits.yml
dry_run_mode:
  available: partial
  note: The Contact Checker endpoints (personal_email_status, work_email_status, phone_status) report whether an email/phone exists for a profile without revealing it; POST /v1/people/count returns a match count before a paid search. These are documented "check before you spend" calls, not a general dry-run flag.
webhooks:
  mechanism: callback_url in the request body of POST /v2/people/linkedin/batch; results are POSTed as JSON to that URL when the job finishes
  signature: null
