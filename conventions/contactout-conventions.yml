authentication:
  style: API key in a custom request header
  header: 'token: <YOUR_API_TOKEN>'
  also_sent: 'authorization: basic (shown in the reference curl example)'
  mcp: OAuth 2.0 authorization code + PKCE for the hosted MCP server at https://contactout.com/mcp (scope mcp:use)
  docs: https://api.contactout.com#authentication
  artifact: authentication/contactout-authentication.yml
idempotency:
  coverage: none
  mechanism: null
  header: null
  retention: null
  scope: []
  docs: https://api.contactout.com
  note: No idempotency key or replay-protection mechanism is documented on any of the 13 mutating operations (search/count/enrich POSTs, bulk jobs, campaign start/stop and recipient add/remove). Credit-consuming calls repeated by a client are charged again as documented under each endpoints Cost.
reversibility:
  status: documented
  surfaces:
  - write: campaignsStartCampaign
    reversal: campaignsStopCampaign
    window: null
    docs: https://api.contactout.com#campaigns-api
    note: POST /v1/campaigns/{campaign_id}/stop stops a started campaign; no window is stated.
  - write: campaignsAddRecipients
    reversal: campaignsRemoveRecipients
    window: null
    docs: https://api.contactout.com#campaigns-api
    note: DELETE /v1/campaigns/{campaign_id}/recipients removes recipients added with POST; no window is stated.
  - write: peopleEnrich / contactInfoSingleFromLinkedinProfile / peopleSearch and every other credit-consuming call
    reversal: null
    window: null
    note: Credits consumed when a result is found are not documented as refundable; GET /v1/stats reports remaining credits.
  note: Two campaign actions have documented reversal operations without a stated window (documented, not verified). The data-retrieval surface spends credits that no documented operation returns.
pagination:
  style: page number
  params:
    page: page number (1-based)
    page_size: page size
  operations:
  - peopleSearch
  - decisionMakers
  - campaignsListCampaigns
  response_fields: not documented beyond the examples
  docs: https://api.contactout.com#people-search-api
field_expansion:
  style: boolean flags on enrichment calls
  params:
  - include_phone (contact info endpoints)
  - profile_only (LinkedIn Profile API)
  - reveal_info (Decision Makers API)
  note: Flags switch whether email/phone are revealed (and charged) rather than sparse-fieldsets.
metadata: null
